serverAddr = "{{ .Server }}"
serverPort = 443
transport.tls.enable = true
metadatas.token = "{{ .Token }}"
webServer.unixSocket = "{{ .AdminSocket }}"
{{ if .Web }}
[[proxies]]
name = "{{ .Domain }}"
type = "https"
customDomains = ["{{ .Domain }}", "*.{{ .Domain }}"]
localIP = "127.0.0.1"
localPort = {{ .LocalPort }}
{{ end }}{{ if .Mail }}
[[proxies]]
name = "{{ .Domain }}-smtp"
type = "tcp"
localIP = "127.0.0.1"
localPort = {{ .MailLocalPort }}
remotePort = {{ .SmtpPort }}
{{ end }}
